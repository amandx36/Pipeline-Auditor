syntax = "proto3";

package collector;

option go_package = "github.com/amandx36/Pipeline-Auditor/gen/collector";

message PipelineEvent {
    string provider = 1;
    string repository = 2;
    string pipeline_id = 3;

    uint64 run_number = 4;
    uint32 run_attempt = 5;

    string pipeline_name = 6;
    string branch = 7;
    string commit_sha = 8;
    string event = 9;
    string status = 10;
    string conclusion = 11;
    string logs_url = 12;
    string html_url = 13;
}

message CollectLogsRequest {
    PipelineEvent pipeline = 1;
}

message CollectLogsResponse {
    bool accepted = 1;
    string collection_id = 2;
    string message = 3;
}

service LogCollector {
    rpc CollectLogs(CollectLogsRequest)
        returns (CollectLogsResponse);
}